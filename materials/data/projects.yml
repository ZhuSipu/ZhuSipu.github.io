- title: Multisensory VR Study on Stress Recovery in Hospital Staff Break Spaces
  importance: 1
  year: 2026
  description: Investigates how visual, auditory, and olfactory stimuli jointly support stress recovery in hospital staff break spaces through VR-based experiments with psychological and physiological measures.
  details: |
    Publication: Lyu, Dalin, Hengyi Cong, Sipu Zhu, Yulong Liu, and Weimin Zhuang. "Healing with sight, smell and sound: A virtual reality study on multisensory synergistic stress recovery in hospital staff break spaces." Building and Environment (2026): 114587.

- title: Human-Robot Interaction in Architectural Space
  importance: 2
  year: 2026
  description: Examines how spatial scale influences human visual attention and perception toward robots through controlled eye-tracking experiments in corridor and hall settings.
  details: |
    Status: Under review.
    Collaboration: Robot Control Laboratory, Department of Automation, Tsinghua University; AgiBot (Accelerated Evolution Robotics).

- title: Evaluation of Aesthetic Perception in Large Models
  importance: 3
  year: 2025
  description: Evaluates the aesthetic perception of large models by comparing their judgments on architectural images with human aesthetic responses.
  details: |
    Recognition: Rated A+ in the Tsinghua University Student Research Training (SRT) Program.
    Collaboration: Tsinghua FIB Lab, Department of Electronic Engineering, Tsinghua University.

- title: Immersive Architectural Interaction Design with CAVE Projection
  importance: 4
  year: 2024
  description: Explores immersive and interactive architectural design workflows using CAVE projection, VR simulation, and real-time digital environments.
  details: |
    Recognition: Rated A+ in the Tsinghua University Student Research Training (SRT) Program.
    Outcome: Long-term exhibition at the CAVE Space, School of Architecture, Tsinghua University; presented to Mark Evans and Annabell Ren of the Illinois Institute of Technology College of Architecture.
